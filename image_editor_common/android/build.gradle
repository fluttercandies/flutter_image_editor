group 'com.fluttercandies.image_editor'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
// AGP 9 enables built-in Kotlin and no longer allows library subprojects to apply
// the Kotlin Gradle Plugin (KGP). Apply KGP ourselves whenever built-in Kotlin is
// not in effect; the pluginManager form keeps Flutter's static KGP detection from
// flagging this plugin. See
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def builtInKotlinEnabled = project.findProperty('android.builtInKotlin')?.toString()?.toBoolean() ?: (agpMajor >= 9)
apply plugin: 'com.android.library'
if (agpMajor < 9 || !builtInKotlinEnabled) {
    pluginManager.apply('kotlin-android')
}

android {
    if (project.hasProperty('compileSdk')) {
        compileSdk = 35
    } else {
        compileSdkVersion = 35
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    if (!builtInKotlinEnabled) {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }

    defaultConfig {
        minSdkVersion 16
    }

    if (project.android.hasProperty('namespace')) {
        namespace 'com.fluttercandies.image_editor'
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.3'
    implementation 'com.jaredrummler:truetypeparser-light:1.0.0'
}

if (builtInKotlinEnabled) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}
