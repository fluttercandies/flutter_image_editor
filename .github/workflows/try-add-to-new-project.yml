name: Add library to new flutter project

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-for-android:
    name: Build for Android on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: flutter doctor -v
      - run: flutter create new_project --platforms=android
      - name: Add image_editor to new project.
        run: flutter pub add -- 'image_editor:{"path":"../image_editor"}'
        working-directory: ${{ github.workspace }}/new_project
        shell: bash
      - run: flutter pub get
        working-directory: ${{ github.workspace }}/new_project
      - run: flutter build apk --debug
        working-directory: ${{ github.workspace }}/new_project
        name: Build example

  build-for-ios:
    name: Build for iOS on macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter doctor -v
      - run: flutter create new_project --platforms=ios
      - name: Add image_editor to new project.
        run: flutter pub add -- 'image_editor:{"path":"../image_editor"}'
        working-directory: ${{ github.workspace }}/new_project
        shell: bash
      - run: flutter pub get
        working-directory: ${{ github.workspace }}/new_project
      - run: flutter build ios --release --no-codesign
        working-directory: ${{ github.workspace }}/new_project
        name: Build example

  build-for-macos:
    name: Build for macOS on macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter doctor -v
      - run: flutter create new_project --platforms=macos
      - name: Add image_editor to new project.
        run: flutter pub add -- 'image_editor:{"path":"../image_editor"}'
        working-directory: ${{ github.workspace }}/new_project
        shell: bash
      - run: flutter pub get
        working-directory: ${{ github.workspace }}/new_project
      - run: flutter build macos --release
        working-directory: ${{ github.workspace }}/new_project
        name: Build example

  build-for-web:
    name: Build for Web on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter doctor -v
      - run: flutter create new_project --platforms=web
      - name: Add image_editor to new project.
        run: flutter pub add -- 'image_editor:{"path":"../image_editor"}'
        working-directory: ${{ github.workspace }}/new_project
        shell: bash
      - run: flutter pub get
        working-directory: ${{ github.workspace }}/new_project
      - run: flutter build web --release
        working-directory: ${{ github.workspace }}/new_project
        name: Build example

  build-for-linux:
    name: Build for Linux on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install required packages
        run: |
              sudo apt-get update -y
              sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Enable support for linux
        run: flutter config --enable-linux-desktop
      - run: flutter doctor -v
      - run: flutter create new_project --platforms=linux
      - name: Add image_editor to new project.
        run: flutter pub add -- 'image_editor:{"path":"../image_editor"}'
        working-directory: ${{ github.workspace }}/new_project
        shell: bash
      - run: flutter pub get
        working-directory: ${{ github.workspace }}/new_project
      - run: flutter build linux --release
        working-directory: ${{ github.workspace }}/new_project
        name: Build example

  build-for-windows:
    name: Build for Windows on windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter doctor -v
      - run: flutter create new_project --platforms=windows
      - name: Add image_editor to new project.
        run: flutter pub add -- 'image_editor:{"path":"../image_editor"}'
        working-directory: ${{ github.workspace }}/new_project
        shell: bash
      - run: flutter pub get
        working-directory: ${{ github.workspace }}/new_project
      - run: flutter build windows --release
        working-directory: ${{ github.workspace }}/new_project
        name: Build example
