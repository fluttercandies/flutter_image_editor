name: Runnable (stable)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions: {}

jobs:
  analyze:
    name: Analyze code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Log Dart/Flutter versions
        run: |
          dart --version
          flutter --version
      - name: Analyze image_editor
        run: cd image_editor && flutter pub get && flutter analyze lib
      - name: Analyze image_editor_common
        run: cd image_editor_common && flutter pub get && flutter analyze lib
      - name: Analyze image_editor_platform_interface
        run: cd image_editor_platform_interface && flutter pub get && flutter analyze lib
      - name: Analyze example
        run: |
          cd image_editor/example
          flutter pub get
          flutter analyze lib
      - name: Dry run docs generate
        run: cd image_editor && dart doc --dry-run .
        continue-on-error: true

  library_tests:
    name: Library tests (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "3.7.12", version: "3.7.12"}
          - {label: "stable", version: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Analyze library packages
        shell: bash
        run: |
          set -euo pipefail
          for package in image_editor image_editor_common image_editor_platform_interface; do
            (cd "$package" && dart pub get && flutter analyze --no-pub lib)
          done
      - name: Run package unit tests
        working-directory: image_editor_platform_interface
        run: flutter test --no-pub

  test_ios:
    needs: analyze
    name: Test iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: dart --version
      - run: flutter --version
      - run: cd image_editor; flutter pub get
      - run: cd image_editor/example; flutter build ios --debug --no-codesign

  test_android:
    needs: analyze
    name: Test Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: dart --version
      - run: flutter --version
      - run: cd image_editor; flutter pub get
      - run: cd image_editor/example; flutter build apk --debug --android-skip-build-dependency-validation

  test_macos:
    needs: analyze
    name: Test macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: dart --version
      - run: flutter --version
      - run: cd image_editor; flutter pub get
      - run: cd image_editor/example; flutter build macos --debug
